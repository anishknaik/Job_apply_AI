<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover letter</title>
<style>
/* A cover letter for an ATS file upload, under the resume's rules: one plain
   column, a stock font stack, no ligatures. An fi ligature extracts as the
   single codepoint U+FB01, and a parser then reads a different word. */

@page {
  size: Letter;
  margin: 1in;
}

html, body {
  margin: 0;
  padding: 0;
}

body {
  font-family: Calibri, Carlito, "Segoe UI", Arial, sans-serif;
  font-size: {{FONT_SIZE}}pt;
  line-height: 1.3;
  color: #000;
  font-variant-ligatures: none;
  -webkit-font-variant-ligatures: none;
}

p {
  margin: 0 0 0.9em;
}
</style>
</head>
<body>
{{BODY}}
</body>
</html>
